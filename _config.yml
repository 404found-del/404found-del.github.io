# --- Site identity -----------------------------------------------------------
title: "dataarchitect.studio"
tagline: "Notes on the architecture of data"
description: >-
  Essays and field notes on data architecture, data modeling, dimensional
  modeling, data contracts, and the lakehouse — practical writing for data
  engineers and architects who design systems that make information trustworthy.
url: "https://dataarchitect.studio"
baseurl: ""
lang: en

# Author / publisher is the publication itself — no personal name.
author: "dataarchitect.studio"

# --- Build -------------------------------------------------------------------
permalink: /essays/:title/
timezone: Asia/Kolkata

# --- Markdown: pinned explicitly, and this matters -----------------------------
# These were previously UNSET, which meant the renderer was inherited from
# whichever pipeline happened to build the site:
#   * GitHub Pages' legacy branch build (github-pages gem) FORCES input: GFM.
#   * A standalone Jekyll 4 build defaults to input: kramdown, NOT GFM.
# Same source, two different markdown parsers. Pinning them here makes the two
# pipelines render identically, so switching Pages source is a safe operation
# rather than a silent content change across 50 essays of fenced code and tables.
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

# --- Collections ---------------------------------------------------------------
collections:
  patterns:
    output: true
    permalink: /patterns/:name/
  glossary:
    output: true
    permalink: /glossary/:name/

# --- Collections defaults ----------------------------------------------------
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "patterns"
    values:
      layout: "pattern"
      kicker: "Pattern"
      seo:
        type: "TechArticle"
  - scope:
      path: ""
      type: "glossary"
    values:
      layout: "term"
      kicker: "Glossary"
      seo:
        type: "WebPage"
  - scope:
      path: ""
    values:
      layout: "page"
  # Site-wide social/schema image fallback: every page gets og:image + JSON-LD
  # image (jekyll-seo-tag reads page.image; this default supplies it everywhere).
  - scope:
      path: ""
    values:
      image: /assets/og-default.png

# --- Most-read: curated, not automatic ---------------------------------------
# The homepage lists essays by recency, which spends the site's strongest
# internal links on the newest (least proven) work. This list overrides that for
# the top block. Order is deliberate. Review against GSC Pages.csv quarterly.
# Source: GSC Performance-on-Search 2026-08-01, ranked by clicks then impressions.
most_read:
  - /essays/how-to-choose-an-iceberg-catalog/   # 8 clicks, pos 13.1 — best converter
  - /essays/one-big-table-vs-star-schema/       # 5 clicks, page-one cluster
  - /essays/kimball-vs-inmon/                   # 2,298 impressions — biggest page
  - /essays/star-schema-vs-snowflake-schema/    # 2,060 impressions
  - /essays/fact-table-types/                   # 4 clicks, pos 29.1
  - /essays/apache-iceberg-vs-parquet/          # debuted pos 11.1 — fastest ever

# --- llms-full.txt ordering ---------------------------------------------------
# llms-full.txt is ~400 KB. Retrieval clients that cap their read get whatever is
# at the TOP, and site.posts is reverse-chronological — which put the five most
# AI-cited essays (all older) at the very bottom. These are emitted first.
# Source: Bing AI Performance page report, 2026-08-01, ranked by citations.
llms_priority:
  - /essays/data-warehouse-vs-data-lake-vs-lakehouse/   # 962 citations
  - /essays/fact-table-vs-dimension-table/              # 554
  - /essays/kimball-vs-inmon/                           # 174
  - /essays/star-schema-vs-snowflake-schema/            # 172
  - /essays/conformed-dimensions/                       # 150
  - /essays/data-lake-vs-lakehouse/                     # 39
  - /essays/surrogate-keys-vs-natural-keys/             # 31
  - /essays/factless-fact-tables/                       # 24
  - /essays/one-big-table-vs-star-schema/               # 19
  - /essays/date-dimension-table/                       # 18
  - /essays/normalization-vs-denormalization/           # 17
  - /essays/fact-table-types/                           # 15
  - /essays/data-vault-vs-dimensional-modeling/         # 15

# --- Plugins (all whitelisted on GitHub Pages) -------------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# --- SEO (consumed by jekyll-seo-tag) ----------------------------------------
# Default social-share card used when a page has no image of its own.
image: /assets/og-default.png
logo: /assets/logo.png

twitter:
  card: summary_large_image

social:
  name: "dataarchitect.studio"
  links:
    - https://github.com/404found-del

# --- Exclude from build ------------------------------------------------------
exclude:
  # NOTE: a bare "README.md" matches only the ROOT readme; benchmarks/README.md
  # has its own front matter and an explicit permalink, and must keep building.
  # CI asserts _site/benchmarks/index.html exists so this can't regress silently.
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - preview.html
  - .sass-cache
  - .jekyll-cache
  - submit-indexnow.ps1
  - tools
  - distribution

# --- Growth integrations (fill these in to activate) ---------------------------
# Privacy-friendly analytics: create a free account at goatcounter.com,
# choose a code (e.g. "dataarchitect"), and put it here. Script renders only when set.
goatcounter_code: "vmaheshwari"

# Email list. DISABLED 2026-08-15: the username was derived from the owner's real
# name and appeared in the rendered HTML of every essay, which conflicts with the
# site publishing pseudonymously. Newsletter is also not the objective function
# (see handoff §11.1), so nothing of value is lost by leaving this off.
# _includes/subscribe.html is guarded on this value, so an empty string removes
# the form from the post, pattern, and home layouts. To re-enable, create an
# account under a NEUTRAL handle and put that username here.
buttondown_username: ""

# Search engine verification: both GSC and Bing are DNS-verified, so no meta
# tokens are needed (empty tokens previously shipped dead meta tags on every page).
