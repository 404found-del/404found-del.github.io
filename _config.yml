# --- Site identity -----------------------------------------------------------
title: "dataarchitect.studio"
tagline: "Notes on the architecture of data"
description: >-
  Essays and field notes on data architecture, data modeling, dimensional
  modeling, data contracts, and the lakehouse — practical writing for data
  engineers and architects who design systems that make information trustworthy.
url: "https://dataarchitect.studio"
baseurl: ""
lang: en

# Author / publisher is the publication itself — no personal name.
author: "dataarchitect.studio"

# --- Build -------------------------------------------------------------------
permalink: /essays/:title/
timezone: Asia/Kolkata

# --- Collections ---------------------------------------------------------------
collections:
  patterns:
    output: true
    permalink: /patterns/:name/
  glossary:
    output: true
    permalink: /glossary/:name/

# --- Collections defaults ----------------------------------------------------
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "patterns"
    values:
      layout: "pattern"
      kicker: "Pattern"
  - scope:
      path: ""
      type: "glossary"
    values:
      layout: "term"
      kicker: "Glossary"
  - scope:
      path: ""
    values:
      layout: "page"

# --- Plugins (all whitelisted on GitHub Pages) -------------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# --- SEO (consumed by jekyll-seo-tag) ----------------------------------------
# Default social-share card used when a page has no image of its own.
image: /assets/og-default.png
logo: /assets/logo.png

twitter:
  card: summary_large_image

social:
  name: "dataarchitect.studio"
  links:
    - https://github.com/404found-del

# --- Exclude from build ------------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - preview.html
  - .sass-cache
  - .jekyll-cache
  - submit-indexnow.ps1
  - tools
  - distribution

# --- Growth integrations (fill these in to activate) ---------------------------
# Privacy-friendly analytics: create a free account at goatcounter.com,
# choose a code (e.g. "dataarchitect"), and put it here. Script renders only when set.
goatcounter_code: "vmaheshwari"

# Email list: create a free account at buttondown.com and put your username here.
# The subscribe form renders only when set.
buttondown_username: "maheshwari"

# Search engine verification: paste tokens from Google Search Console and
# Bing Webmaster Tools (DNS verification also works; then leave these blank).
webmaster_verifications:
  google: ""
  bing: ""
