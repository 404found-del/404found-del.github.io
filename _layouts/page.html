---
layout: default
---

<div class="wrap">
  <header class="page-head">
    {%- if page.kicker -%}<p class="article__kicker">{{ page.kicker }}</p>{%- endif -%}
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose" style="margin-top: clamp(2rem, 5vw, 3.5rem);">
    {{ content }}
  </div>
  <div style="height: clamp(4rem, 9vw, 7rem);"></div>
</div>
