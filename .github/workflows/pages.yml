name: Build and deploy Jekyll site to Pages

# THIS IS THE ONLY PAGES WORKFLOW. Do not add a second one.
# When you set Settings -> Pages -> Source to "GitHub Actions", GitHub offers to
# create a starter workflow (jekyll.yml). Decline it. That starter shares this
# file's `concurrency: group: "pages"`, so the two race, and it carries none of
# the validation below -- if it wins, every assertion here is bypassed. A
# jekyll.yml was created that way on 2026-08-15 and removed the same day.
#
# Check the `generator` meta tag on a live page to confirm which pipeline is
# actually deploying: Jekyll 4.x means this workflow, 3.10.x means the legacy
# branch build (which ignores this file and the Gemfile entirely).

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before bundler so a Gemfile/lock mismatch reports as a clear message
      # rather than as bundler exit code 16 seven seconds into the build.
      - name: Check Gemfile and Gemfile.lock agree
        run: |
          set -euo pipefail
          gems=$(grep -oP '^\s*gem\s+"\K[^"]+' Gemfile | sort -u)
          deps=$(sed -n '/^DEPENDENCIES/,/^$/p' Gemfile.lock | sed -n 's/^  \([a-z0-9_-]*\).*/\1/p' | sort -u)
          if [ "$gems" != "$deps" ]; then
            echo "::error::Gemfile and Gemfile.lock disagree. CI runs bundler in frozen mode."
            echo "Gemfile:";      echo "$gems"
            echo "Gemfile.lock:"; echo "$deps"
            echo "Fix: run 'bundle lock' locally and commit Gemfile.lock."
            exit 1
          fi
          echo "Gemfile and lock agree."

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Checks that run against the BUILT output. These exist because
      # llms-full.txt once shipped silently broken for weeks: it rendered
      # without error while omitting every FAQ answer. A green build is not
      # evidence that the output is correct.
      - name: Validate build output
        run: |
          set -euo pipefail
          fail=0
          note () { echo "::error::$1"; fail=1; }

          echo "--- llms-full.txt integrity ---"
          f=_site/llms-full.txt
          test -f "$f" || note "llms-full.txt was not generated"
          qa=$(grep -c '^Q: ' "$f" || true)
          echo "Q/A pairs: $qa"
          [ "$qa" -ge 150 ] || note "llms-full.txt has only $qa Q/A pairs; FAQ injection likely broken"
          svg=$(grep -c '<svg' "$f" || true)
          [ "$svg" -eq 0 ] || note "llms-full.txt leaked $svg <svg> tags; SVG stripping broken"
          # the most-cited essays must appear early, or clients that cap their read miss them
          head -c 131072 "$f" > /tmp/head.txt
          for t in "Data Warehouse vs Data Lake vs Lakehouse" "Fact Table vs Dimension Table" "Kimball vs Inmon"; do
            grep -qF "$t" /tmp/head.txt || note "llms_priority ordering broken: '$t' not in first 128 KB"
          done

          echo "--- core files present ---"
          for p in _site/sitemap.xml _site/llms.txt _site/robots.txt _site/feed.xml \
                   _site/benchmarks/index.html _site/benchmarks/file-format-benchmark.py \
                   _site/benchmarks/results-2026-07-26.json; do
            test -f "$p" || note "missing from build output: $p"
          done

          echo "--- no future-dated posts ---"
          # Jekyll's default future:false silently DROPS posts dated ahead of
          # build time. That reads downstream as a missing page and a cascade of
          # confusing grep failures, so name the real cause here.
          now=$(date -u +%s)
          while IFS= read -r post; do
            d=$(sed -n 's/^date:[[:space:]]*//p' "$post" | head -1)
            ts=$(date -u -d "$d" +%s 2>/dev/null) || continue
            if [ "$ts" -gt "$now" ]; then
              note "future-dated post will not be built: $post (date: $d)"
            fi
          done < <(ls _posts/*.md)

          echo "--- every essay rendered ---"
          src=$(ls _posts/*.md | wc -l)
          out=$(find _site/essays -name index.html | wc -l)
          echo "posts: $src   rendered: $out"
          [ "$out" -ge "$src" ] || note "only $out of $src essays rendered"

          echo "--- every post declares last_modified_at ---"
          # jekyll-sitemap derives <lastmod> from last_modified_at. If an edit
          # does not bump it, the sitemap keeps advertising the old date and
          # Google gets no change signal at all -- the page footer and
          # article:modified_time go stale too. 18 posts were edited on
          # 2026-08-29 with none of them bumped; caught before the push.
          nolm=0
          for post in _posts/*.md; do
            grep -q '^last_modified_at:' "$post" || { echo "  $post"; nolm=$((nolm+1)); }
          done
          [ "$nolm" -eq 0 ] || note "$nolm post(s) missing last_modified_at"

          echo "--- diagram legibility on mobile ---"
          # Diagrams are authored on an ~800-unit viewBox. On a 375px phone the
          # figure is held at 640px by CSS, so a font-size of N units renders at
          # N*0.8 px. Below 10 units that is under 8px and unreadable -- which is
          # what Google sees, since indexing is mobile-first. All 33 diagrams sat
          # at 3.8-5.0px until 2026-08-29.
          small=$(grep -rhoP 'font-size="\d+"' _posts _patterns \
                  | grep -oP '\d+' | awk '$1<10' | wc -l)
          [ "$small" -eq 0 ] || note "$small SVG font-size value(s) below 10 units (<8px on mobile)"
          wide=$(grep -rhoP 'viewBox="0 0 (\d+)' _posts _patterns \
                 | grep -oP '\d+$' | awk '$1>800' | wc -l)
          [ "$wide" -eq 0 ] || note "$wide SVG viewBox wider than 800 units"

          echo "--- rendered <title> length ---"
          # Bing Webmaster flags "Title too long" above ~91 rendered characters,
          # which includes jekyll-seo-tag's " | dataarchitect.studio" suffix (23).
          # Five pages breached this from 2026-08-23 until 2026-08-29. Assert on
          # the BUILT html, not front matter, so the suffix is always counted.
          long=0
          while IFS= read -r page; do
            t=$(sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "$page" | head -1)
            n=${#t}
            if [ "$n" -gt 91 ]; then echo "  $n chars: $t"; long=$((long+1)); fi
          done < <(find _site -name index.html)
          [ "$long" -eq 0 ] || note "$long page(s) exceed the 91-char rendered title limit"

          echo "--- internal links are canonical (no self-redirects) ---"
          # Every internal href must end in / or be a real file. A link to
          # /essays/foo (no slash) 301s to /essays/foo/, which wastes crawl
          # budget and shows up in GSC as "Page with redirect".
          bad=$(grep -rhoP 'href="(https://dataarchitect\.studio)?/[A-Za-z0-9/_-]+"' _site --include='*.html' \
                | sed 's/href="//; s/"$//' | sort -u \
                | grep -vE '/$|\.[a-z0-9]+$' || true)
          if [ -n "$bad" ]; then echo "$bad" | head -10; note "internal links missing trailing slash"; fi

          echo "--- markdown renderer parity ---"
          # These assert the GFM + rouge pipeline pinned in _config.yml actually
          # took effect. If Pages source is switched and the parser silently
          # falls back to kramdown's default input, these fail instead of
          # quietly re-rendering 50 essays of code blocks and tables.
          bm=_site/essays/parquet-vs-orc/index.html
          test -f "$bm" || note "canary page missing: $bm"
          grep -q 'class="highlight"' "$bm" || note "rouge highlighting absent; highlighter/syntax_highlighter not applied"
          grep -q '<table' "$bm" || note "GFM tables not rendering as <table>"
          grep -q '<code' "$bm" || note "fenced code blocks not rendering"
          # kramdown's default parser leaves GFM fenced-block info strings visible
          grep -q '^```' "$bm" && note "raw fence markers in output; GFM input not active" || true

          echo "--- no unrendered Liquid in output ---"
          if grep -rIl '{%\|{{' _site --include='*.html' --include='*.txt' | head -1 | grep -q .; then
            grep -rIn '{%\|{{' _site --include='*.html' --include='*.txt' | head -5
            note "unrendered Liquid found in build output"
          fi

          exit $fail

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    # Only deploy on push to main, never on pull requests.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
